<!doctype html>
<html><head><meta charset="utf-8"><title>Meta Ads Sales Reel</title>
<style>
:root{--bg:#060912;--blue:#2f7bff;--blue2:#5aa2ff;--cyan:#27d3ee;--green:#2ee59d;--red:#ff5a6e;--amber:#ffc24a;--violet:#9a6bff;--ink:#f4f7ff;--mut:#8b97b3;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;background:var(--bg);overflow:hidden;font-family:Inter,"Inter Display",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;width:540px;height:960px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.bg1,.bg2,.bg3{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(120,160,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.07) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:opacity,transform}
.card{position:absolute;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.win .bar{position:absolute;left:0;top:0;right:0;height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:6px;font-size:11px;color:var(--mut);letter-spacing:.2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.lbl{font-size:10px;letter-spacing:1.3px;color:var(--mut);font-weight:600;text-transform:uppercase}
.pill{position:absolute;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.8px;white-space:nowrap}
.k{position:absolute;left:0;right:0;text-align:center}
.letter{display:inline-block;will-change:transform,opacity,filter}
.big{font-weight:800;letter-spacing:-1px}
.grad{background:linear-gradient(90deg,var(--blue2),var(--cyan) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
svg{overflow:visible}
</style></head>
<body>
<div id="stage">
  <div class="bg1" style="width:420px;height:420px;background:#1c4fd8;left:-120px;top:-80px"></div>
  <div class="bg2" style="width:380px;height:380px;background:#0e8fa8;right:-140px;top:360px;opacity:.38"></div>
  <div class="bg3" style="width:340px;height:340px;background:#5b2fd0;left:-60px;bottom:-120px;opacity:.4"></div>
  <div class="grid" id="grid"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="abs" style="left:24px;top:24px;display:flex;align-items:center;gap:8px">
      <svg width="22" height="22" viewBox="0 0 22 22"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#2ee59d"/></linearGradient></defs><rect width="22" height="22" rx="6" fill="url(#lg)"/><path d="M5 15 L9.5 9 L12.5 12.5 L17 6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="font-size:11px;font-weight:800;letter-spacing:2px">GROWTHARC<span style="color:var(--blue2)"> MEDIA</span></div>
    </div>
    <div class="pill" style="right:24px;top:22px;background:rgba(47,123,255,.15);border:1px solid rgba(47,123,255,.4);color:#9cc2ff"><span class="dot" style="background:var(--green);box-shadow:0 0 8px var(--green)"></span>META ADS · SALES</div>
    <div id="steps"></div>
  </div>
  <div id="scenes"></div>
  <div id="endcard" class="scene" style="opacity:0"></div>
  <div class="abs" style="left:0;right:0;bottom:16px;text-align:center;font-size:8.5px;letter-spacing:1px;color:rgba(255,255,255,.3)">ILLUSTRATIVE DASHBOARD DATA</div>
  <div class="vig"></div>
</div>
<script>
/* ============ helpers ============ */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={out:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},lin:x=>x};
const P=(t,a,d,e=E.out)=>e(clamp((t-a)/d));
const lerp=(a,b,k)=>a+(b-a)*k;
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild};
const INR=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const noise=(s)=>{const x=Math.sin(s*127.1)*43758.5453;return x-Math.floor(x)};
const sm=(t,f,s=0)=>Math.sin(t*f+s);
function tf(e,o){ // o: x,y,s,r,op,blur
  const x=o.x||0,y=o.y||0,s=o.s==null?1:o.s,r=o.r||0;
  e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  if(o.op!=null)e.style.opacity=o.op;
  if(o.blur!=null)e.style.filter=o.blur>0.05?`blur(${o.blur}px)`:'none';
}
let T=null; // timeline
const ev=()=>T.ev;

/* ============ HUD step bar ============ */
const STEP_NAMES=['OBJECTIVE','AUDIENCE','CREATIVE','OPTIMIZE','SCALE'];
const stepsEl=document.getElementById('steps');
stepsEl.innerHTML=STEP_NAMES.map((n,i)=>`<div class="abs" style="left:${24+i*100}px;top:58px;width:92px"><div style="font-size:8.5px;letter-spacing:1.2px;font-weight:700;margin-bottom:5px" class="sl">0${i+1} ${n}</div><div style="height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden"><div class="sf" style="height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px"></div></div></div>`).join('');
const sl=[...stepsEl.querySelectorAll('.sl')],sf=[...stepsEl.querySelectorAll('.sf')];
function updHud(t){
  sl.forEach((e,i)=>{const a=i*8,act=t>=a&&t<a+8;e.style.color=act?'#fff':(t>=a+8?'#6f86b8':'#55607a')});
  sf.forEach((e,i)=>e.style.width=(clamp((t-i*8)/8)*100)+'%');
  stepsEl.style.opacity=1-P(t,ev().endcard-.1,.35,E.lin);
}

/* ============ kinetic text ============ */
function Kinetic(parent,words,times,topY,opts={}){
  const root=el(`<div class="abs" style="left:0;right:0;top:${topY}px;height:130px;z-index:60"><div class="crumb" style="position:absolute;left:0;right:0;top:0;text-align:center;font-size:12px;font-weight:700;letter-spacing:2px;color:#7f93c4;height:18px"></div><div class="word big" style="position:absolute;left:0;right:0;top:22px;text-align:center;font-size:${opts.size||44}px;line-height:1.05"></div><div class="sub" style="position:absolute;left:0;right:0;top:92px;text-align:center;font-size:11px;letter-spacing:2.4px;color:var(--mut)">${opts.sub||''}</div></div>`);
  parent.appendChild(root);
  const crumb=root.querySelector('.crumb'),word=root.querySelector('.word');let last=-2;
  return t=>{
    let idx=-1;times.forEach((x,i)=>{if(t>=x)idx=i});
    if(idx!==last){last=idx;
      crumb.innerHTML=words.slice(0,Math.max(0,idx)).map(w=>w+' <span style="color:var(--blue2)">→</span> ').join('');
      word.innerHTML=idx<0?'':[...words[idx]].map(ch=>`<span class="letter">${ch===' '?'&nbsp;':ch}</span>`).join('');
      word.className='word big';word.style.color=idx===words.length-1?'#5eead4':'#fff';word.style.textShadow=idx===words.length-1?'0 0 40px rgba(46,229,157,.45)':'none';
    }
    if(idx>=0){const ls=word.children;[...ls].forEach((s,i)=>{const p=P(t,times[idx]+i*.028,.34,E.out5);s.style.opacity=p;s.style.transform=`translateY(${(1-p)*26}px) scale(${.8+.2*p})`;s.style.filter=`blur(${(1-p)*6}px)`})}
    const o=opts.fade?1-P(t,opts.fade,.3,E.lin):1;root.style.opacity=o;
  };
}

/* ============ shared drawings ============ */
const WATCH=(w=90)=>`<svg width="${w}" height="${w}" viewBox="0 0 100 100"><defs><linearGradient id="wg${w}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d98b"/><stop offset="1" stop-color="#b8873a"/></linearGradient><radialGradient id="wf${w}"><stop offset="0" stop-color="#1b2540"/><stop offset="1" stop-color="#0a0f20"/></radialGradient></defs><rect x="38" y="2" width="24" height="96" rx="8" fill="#26304f"/><circle cx="50" cy="50" r="30" fill="url(#wg${w})"/><circle cx="50" cy="50" r="25" fill="url(#wf${w})"/><g stroke="#f5d98b" stroke-width="1.5" stroke-linecap="round"><path d="M50 30v4M50 66v4M30 50h4M66 50h4"/></g><path d="M50 50L50 36M50 50L61 56" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="50" cy="50" r="2.4" fill="#2ee59d"/></svg>`;
const sparkPath=(arr,w,h)=>{const mn=Math.min(...arr),mx=Math.max(...arr);return arr.map((v,i)=>`${i?'L':'M'}${(i/(arr.length-1)*w).toFixed(1)} ${(h-(v-mn)/(mx-mn||1)*h).toFixed(1)}`).join(' ')};
const SERIES={up:[3,4,3.6,5,4.6,6,5.8,7.4,7,9],down:[9,8.2,8.6,7,7.4,6,6.3,5,4.6,3.6],flat:[5,5.6,5,6,5.4,5.9,5.2,6,5.5,5.8]};
const checkSvg=c=>`<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="${c}"/><path class="ck" d="M5 9.3L8 12L13 6.5" stroke="#06101f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`;
const setCheck=(e,p)=>{const c=e.querySelector('.ck');c.style.strokeDashoffset=1-p};

/* ============ cursor ============ */
const cursor=el(`<div class="abs" style="left:0;top:0;width:28px;height:28px;z-index:50;opacity:0"><svg width="26" height="30" viewBox="0 0 26 30"><path d="M3 2 L3 22 L8.5 17 L12.5 26 L16 24.5 L12 15.8 L19.5 15.8 Z" fill="#fff" stroke="#0b1020" stroke-width="1.6" stroke-linejoin="round"/></svg></div>`);
const ripple=el(`<div class="abs" style="left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid #7fb0ff;opacity:0;z-index:49"></div>`);
function moveCursor(t,path,clicks){
  const sm_=x=>x*x*(3-2*x);let x=path[0][1],y=path[0][2];
  for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];if(t>=a[0]&&t<=b[0]){const k=sm_((t-a[0])/(b[0]-a[0]));x=lerp(a[1],b[1],k);y=lerp(a[2],b[2],k)}else if(t>b[0]){x=b[1];y=b[2]}}
  let press=0,rp=0,rx=0,ry=0;
  clicks.forEach(c=>{const d=t-c[0];if(d>-.08&&d<.12)press=1-Math.abs(d-.02)/.1;if(d>=0&&d<.55){rp=d/.55;rx=c[1];ry=c[2]}});
  cursor.style.transform=`translate(${x}px,${y}px) scale(${1-.12*clamp(press)})`;
  ripple.style.opacity=rp>0?(1-rp)*.9:0;ripple.style.transform=`translate(${rx}px,${ry}px) scale(${.3+rp*1.3})`;
}

/* ============ SCENES ============ */
const scenesEl=document.getElementById('scenes');
const S={};

/* ---------- Scene 1 : objective ---------- */
(function(){
  const sc=el('<div class="scene" id="s1"></div>');scenesEl.appendChild(sc);
  const OBJ=[['Awareness','#8b97b3'],['Traffic','#8b97b3'],['Engagement','#8b97b3'],['Leads','#8b97b3'],['App promotion','#8b97b3'],['Sales','#2f7bff']];
  const rows=OBJ.map((o,i)=>`<div class="orow abs" style="left:14px;top:${72+i*36}px;width:206px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;align-items:center;gap:9px;padding:0 10px;font-size:12px;font-weight:600"><span class="dot" style="background:${o[1]};opacity:.8"></span>${o[0]}<span class="ocheck" style="margin-left:auto;opacity:0">${checkSvg('#2f7bff')}</span></div>`).join('');
  const stepRow=(i,l,v)=>`<div class="srow abs" style="left:240px;top:${72+i*66}px;width:238px;height:58px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:10px 12px"><div class="lbl">${l}</div><div style="font-size:16px;font-weight:700;margin-top:4px" class="sval">${v}</div><div class="abs" style="right:12px;top:19px">${checkSvg('#2ee59d')}</div></div>`;
  const win=el(`<div class="card win" style="left:24px;top:112px;width:492px;height:312px"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:8px">Meta Ads Manager &nbsp;›&nbsp; Create new campaign</span><span style="margin-left:auto;color:#9cc2ff">Draft</span></div>
    <div class="abs lbl" style="left:16px;top:48px">Choose a campaign objective</div>
    <div class="abs lbl" style="left:242px;top:48px">Campaign setup</div>${rows}
    ${stepRow(0,'Objective','Sales')}${stepRow(1,'Conversion location','Website')}${stepRow(2,'Conversion event','Purchase')}</div>`);
  sc.appendChild(win);
  const orow=[...win.querySelectorAll('.orow')],srow=[...win.querySelectorAll('.srow')];
  // product card
  const prod=el(`<div class="card" style="left:24px;top:440px;width:492px;height:150px;transform-origin:50% 50%"><div class="abs" style="left:14px;top:14px;width:122px;height:122px;border-radius:14px;background:radial-gradient(circle at 40% 30%,#2a3a6e,#0e1530);display:flex;align-items:center;justify-content:center">${WATCH(100)}</div>
    <div class="abs" style="left:152px;top:18px"><div class="lbl">Shopify · Product</div><div style="font-size:18px;font-weight:700;margin-top:4px">Aero Chrono Watch</div><div style="color:var(--amber);font-size:12px;margin-top:3px">★★★★★ <span style="color:var(--mut)">4.8 (2,184)</span></div><div style="font-size:22px;font-weight:800;margin-top:5px">₹1,200</div></div>
    <div class="abs btn" style="right:16px;bottom:16px;padding:9px 18px;border-radius:10px;background:var(--blue);font-weight:700;font-size:12px;box-shadow:0 8px 20px rgba(47,123,255,.4)">Add to cart</div></div>`);
  const evc=el(`<div class="card" style="left:24px;top:440px;width:492px;height:150px;opacity:0;border-color:rgba(46,229,157,.5);box-shadow:0 0 60px rgba(46,229,157,.18),0 20px 50px rgba(0,0,0,.45)"><div class="abs" style="left:18px;top:25px;width:100px;height:100px"><div class="ring abs" style="inset:0;border-radius:50%;border:2px solid var(--green)"></div><div class="ring2 abs" style="inset:0;border-radius:50%;border:2px solid var(--green)"></div><div class="abs" style="inset:14px;border-radius:50%;background:linear-gradient(135deg,#2ee59d,#18a874);display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#05150f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></div></div>
    <div class="abs" style="left:140px;top:20px"><div class="lbl" style="color:var(--green)">Conversion event fired</div><div style="font-size:26px;font-weight:800;margin-top:3px">Purchase</div><div style="font-family:ui-monospace,monospace;font-size:11px;color:#a9b8d8;margin-top:6px;line-height:1.55">value: <span style="color:var(--amber)">1200</span> &nbsp; currency: <span style="color:var(--cyan)">"INR"</span></div><div style="display:flex;gap:8px;margin-top:8px"><span class="pill" style="position:static;background:rgba(46,229,157,.14);color:#6ff0bd;padding:3px 9px">PIXEL ✓</span><span class="pill" style="position:static;background:rgba(46,229,157,.14);color:#6ff0bd;padding:3px 9px">CONVERSIONS API ✓</span></div></div></div>`);
  sc.appendChild(prod);sc.appendChild(evc);
  // funnel
  const FUN=['ViewContent','AddToCart','InitiateCheckout','Purchase'];
  const fun=el(`<div class="abs" style="left:24px;top:606px;width:492px"><div class="lbl" style="margin-bottom:8px">Standard events · optimise for the one that pays</div><div style="display:flex;gap:6px">${FUN.map((f,i)=>`<div class="fch" style="flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#9fb0d6">${f}</div>`).join('')}</div></div>`);
  sc.appendChild(fun);const fch=[...fun.querySelectorAll('.fch')];
  const dotp=el('<div class="abs" style="left:0;top:0;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--green);box-shadow:0 0 18px 4px rgba(46,229,157,.8);opacity:0;z-index:20"></div>');sc.appendChild(dotp);
  sc.appendChild(cursor);sc.appendChild(ripple);
  let kinT=null;
  S.s1=t=>{
    const e=ev();if(!kinT){kinT=Kinetic(sc,['SALES','PURCHASE','CONVERSION'],[e.k1,e.k2,e.k3],738,{size:50,sub:'SALES OBJECTIVE · WEBSITE · PURCHASE EVENT'})}
    // window entrance
    const w=P(t,0,.8,E.out5);tf(win,{y:(1-w)*60,op:w,s:.96+.04*w});
    // objective selection
    const sel=P(t,e.click,.3);
    orow.forEach((r,i)=>{if(i<5){r.style.opacity=1-.6*sel;r.style.transform=`translateX(${-8*sel}px)`}else{r.style.borderColor=`rgba(47,123,255,${.2+.8*sel})`;r.style.background=`rgba(47,123,255,${.04+.2*sel})`;r.style.boxShadow=`0 0 ${30*sel}px rgba(47,123,255,${.45*sel})`;r.querySelector('.ocheck').style.opacity=sel;r.style.transform=`scale(${1+.03*sel})`}});
    // steps
    [e.step1,e.step2,e.step3].forEach((ts,i)=>{const p=P(t,ts,.4,E.back);const r=srow[i];const o=.25+.75*clamp(p);r.style.opacity=o;r.style.transform=`translateX(${(1-clamp(p))*18}px)`;r.style.borderColor=p>0.5?'rgba(46,229,157,.55)':'var(--line)';setCheck(r,P(t,ts+.12,.3,E.lin))});
    // product card
    const pc=P(t,e.card,.7,E.out5),xf=P(t,e.xform,.55,E.io);
    tf(prod,{y:(1-pc)*80-xf*20,op:pc*(1-xf),s:(.94+.06*pc)*(1-.1*xf),blur:xf*10});
    const btn=prod.querySelector('.btn');btn.style.transform=`scale(${1-.1*P(t,e.xform-.1,.1,E.lin)})`;
    tf(evc,{y:(1-xf)*30,op:xf,s:.92+.08*E.back(xf)});
    const rr=(t-e.xform);[evc.querySelector('.ring'),evc.querySelector('.ring2')].forEach((r,i)=>{const q=clamp((rr-i*.4)/1.2);const loop=rr>0?(q>=1?((rr-i*.4)%1.2)/1.2:q):0;r.style.transform=`scale(${1+loop*.7})`;r.style.opacity=rr>0?(1-loop)*.7:0});
    // data dot to step 3
    const dp=P(t,e.xform+.2,.7,E.io);dotp.style.opacity=dp>0&&dp<1?1:0;
    const bx=lerp(270,380,dp),by=lerp(520,112+72+2*66+29,dp)-Math.sin(dp*Math.PI)*60;dotp.style.transform=`translate(${bx}px,${by}px)`;
    // funnel
    const fp=P(t,e.card+.5,.6);fun.style.opacity=fp;fun.style.transform=`translateY(${(1-fp)*20}px)`;
    fch.forEach((c,i)=>{const hit=i===3?P(t,e.xform+.1,.3):0;c.style.borderColor=`rgba(46,229,157,${.2+hit*.8})`;c.style.background=`rgba(46,229,157,${hit*.2})`;c.style.color=hit>.5?'#6ff0bd':'#9fb0d6';c.style.transform=`scale(${1+.05*hit})`});
    kinT(t);
    cursor.style.opacity=P(t,.25,.3,E.lin)*(1-P(t,7.1,.3,E.lin));
    moveCursor(t,[[.25,500,760],[e.click-.05,138,379],[e.click+.7,320,330],[e.card+.7,400,500],[e.xform-.1,452,548],[e.xform+.7,480,640],[7.5,500,760]],[[e.click,138,379],[e.xform,452,548]]);
  };
})();

/* ---------- Scene 2 : audience ---------- */
(function(){
  const sc=el('<div class="scene" id="s2"></div>');scenesEl.appendChild(sc);
  const A=[{n:'Broad',x:150,y:238,c:'#5aa2ff',cvr:1.4,key:'broad'},{n:'Interest',x:390,y:238,c:'#9a6bff',cvr:2.1,key:'interest'},{n:'Lookalike 1%',x:150,y:492,c:'#2ee59d',cvr:4.2,key:'look'},{n:'Retargeting',x:390,y:492,c:'#ffc24a',cvr:3.1,key:'retarget'}];
  const R=84;
  const head=el(`<div class="abs" style="left:24px;top:112px;width:492px;display:flex;align-items:center;justify-content:space-between"><div><div class="lbl">Ad set testing</div><div style="font-size:18px;font-weight:800;margin-top:2px">Audience Test · 4 ad sets</div></div><div class="pill" style="position:static;background:rgba(255,194,74,.12);border:1px solid rgba(255,194,74,.35);color:#ffd27a" id="lrn"><span class="dot" style="background:var(--amber)"></span>LEARNING</div></div>`);
